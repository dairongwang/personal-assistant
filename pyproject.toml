# Tooling configuration for the Python parts outside services/account (dev.py, e2e/).
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["venv", ".venv", "node_modules", "services"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["e2e"]
addopts = "-q"
