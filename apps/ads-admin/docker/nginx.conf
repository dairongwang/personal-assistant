# Ads admin dashboard: static files only. The API lives elsewhere (config.js → apiBase).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Only this origin's scripts/styles; the API origin is allowed for fetch (connect-src).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' ${ADS_ADMIN_API_BASE}; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location = /config.js { add_header Cache-Control "no-store" always; }
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location / { try_files $uri $uri/ /index.html; }
    location = /healthz { return 200 "ok"; add_header Content-Type text/plain; }
}
