# Tooling configuration only (this backend is not packaged).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
# B008: `Depends(...)` in defaults is the FastAPI idiom.
ignore = ["B008"]
